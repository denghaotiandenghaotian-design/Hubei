<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>湖北遴选复习工作台</title>
<style>
:root{--navy:#0f172a;--navy2:#1e293b;--gold:#e2a252;--blue:#2563eb;--red:#dc2626;--green:#16a34a;
--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b;--chip:#eef2ff;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
color:var(--txt);background:var(--bg);font-size:14px;line-height:1.6}
/* 顶栏 */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--navy);color:#fff;display:flex;
align-items:center;gap:14px;padding:0 16px;z-index:50}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:36px;border-radius:18px;border:none;padding:0 16px 0 38px;font-size:14px;background:#1e293b;color:#fff}
.search input::placeholder{color:#94a3b8}
.search svg{position:absolute;left:12px;top:9px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#0f172a;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
.iconbtn{width:36px;height:36px;border-radius:8px;background:#1e293b;color:#cbd5e1;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.iconbtn:hover{background:#334155}
.menu-pop{position:absolute;right:16px;top:52px;background:#fff;color:var(--txt);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);min-width:200px;display:none;overflow:hidden;z-index:60}
.menu-pop.show{display:block}
.menu-pop button{display:block;width:100%;text-align:left;padding:11px 16px;background:none;border:none;font-size:13.5px;cursor:pointer}
.menu-pop button:hover{background:var(--bg)}
/* 三栏布局 */
.layout{display:flex;margin-top:56px;height:calc(100vh - 56px)}
.sidebar{width:218px;background:var(--navy2);color:#cbd5e1;flex-shrink:0;overflow-y:auto;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;cursor:pointer;font-size:14px;border-left:3px solid transparent}
.nav-item:hover{background:#0f172a;color:#fff}
.nav-item.active{background:#0f172a;color:#fff;border-left-color:var(--gold)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-sec{font-size:11px;color:#64748b;padding:14px 18px 4px;letter-spacing:1px}
.main{flex:1;overflow-y:auto;padding:18px;min-width:0}
.panel{width:330px;background:#fff;border-left:1px solid var(--line);flex-shrink:0;overflow-y:auto;padding:16px}
/* 通用卡片/按钮 */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:6px}
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:13.5px;cursor:pointer;background:var(--blue);color:#fff;font-weight:600}
.btn:hover{filter:brightness(.95)}
.btn.gold{background:var(--gold);color:#0f172a}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.danger{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;background:var(--chip);color:var(--blue);border-radius:20px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
.chip.gray{background:#f1f5f9;color:var(--mut)}
.chip.red{background:#fee2e2;color:var(--red)}
.chip.green{background:#dcfce7;color:var(--green)}
.chip.gold{background:#fef3c7;color:#b45309}
.mut{color:var(--mut);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center}
/* 表格 */
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13.3px;vertical-align:top}
.tbl th{background:#f8fafc;color:var(--mut);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
.tbl th:hover{color:var(--blue)}
.tbl tr:hover{background:#f8fafc}
.tbl tr.sel{background:#fff7ed}
.tbl tbody tr{cursor:pointer}
/* 工具栏 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;background:#fff}
.toolbar input[type=text],.toolbar input[type=search]{min-width:160px}
/* 模态 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:20px}
.modal h2{font-size:17px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
.field label .req{color:var(--red);margin-left:2px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fff}
.field textarea{min-height:90px;resize:vertical}
.field .err{color:var(--red);font-size:12px;margin-top:4px;display:none}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--red)}
.field.bad .err{display:block}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast-item{background:var(--navy);color:#fff;padding:10px 18px;border-radius:24px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:tin .25s}
.toast-item.ok{background:var(--green)}
.toast-item.err{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
/* 分页 */
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}
.pager button.cur{background:var(--blue);color:#fff;border-color:var(--blue)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.empty{text-align:center;color:var(--mut);padding:40px}
/* 移动端菜单按钮 */
.hamburger{display:none;background:none;border:none;color:#fff;cursor:pointer}
@media(max-width:1080px){.panel{display:none}}
@media(max-width:860px){
  .hamburger{display:flex}
  .sidebar{position:fixed;left:-240px;top:56px;bottom:0;z-index:80;transition:left .2s}
  .sidebar.open{left:0}
  .main{padding:12px}
  .toolbar input[type=text]{min-width:120px;flex:1}
}
</style>
</head>

/* ============ 工作台核心：状态/存储/工具/模态 ============ */
const PREFIX = 'wb_hbkx_';
const LS_KEYS = ['kb','papers','wrong','cards','jin','topics','plans'];
const App = {};
App.state = { current:'dashboard', page:1, sort:{}, filter:{}, selId:null, search:'' };

/* localStorage 读写（统一前缀，键隔离） */
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(PREFIX+k)); }catch(e){ return null; } }
function lsSet(k,v){ localStorage.setItem(PREFIX+k, JSON.stringify(v)); }
function uid(p){ return p + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }

/* 首次加载：用内置示例数据初始化 */
App.initData = function(){
  LS_KEYS.forEach(k=>{ if(lsGet(k)==null) lsSet(k, JSON.parse(JSON.stringify(MOCK[k]))); });
};
App.load = function(){ App.data = {}; LS_KEYS.forEach(k=> App.data[k] = lsGet(k) || []); };
App.save = function(k){ lsSet(k, App.data[k]); };

/* toast 反馈 */
App.toast = function(msg, type){
  const box = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast-item' + (type?(' '+type):'');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 1900);
};

/* 模态：打开/关闭 */
App.openModal = function(html){
  document.getElementById('modal').innerHTML = html;
  document.getElementById('mask').classList.add('show');
};
App.closeModal = function(){ document.getElementById('mask').classList.remove('show'); };

/* 删除确认 */
App.confirm = function(msg, cb){
  App.openModal('<h2>确认操作</h2><p style="margin:8px 0 16px;color:#64748b">'+msg+'</p>'+
    '<div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="App.closeModal()">取消</button>'+
    '<button class="btn danger" id="cfmOk">确定删除</button></div>');
  document.getElementById('cfmOk').onclick = function(){ App.closeModal(); cb(); };
};

/* 左侧导航与顶栏交互 */
App.toggleNav = function(){ document.getElementById('sidebar').classList.toggle('open'); };
App.openUserMenu = function(){ document.getElementById('userMenu').classList.toggle('show'); };
document.addEventListener('click', function(e){
  const m = document.getElementById('userMenu');
  if(m && !e.target.closest('.menu-pop') && !e.target.closest('.avatar') && !e.target.closest('.iconbtn')) m.classList.remove('show');
});

/* 导出/导入/重置/清空 */
App.exportAll = function(){
  const out = {}; LS_KEYS.forEach(k=> out[k]=App.data[k]);
  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = '湖北遴选工作台数据备份.json'; a.click();
  App.toast('已导出全部数据', 'ok');
};
App.importAll = function(){ document.getElementById('fileInput').click(); };
App.doImport = function(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = function(){
    try{
      const obj = JSON.parse(r.result);
      LS_KEYS.forEach(k=>{ if(obj[k]) App.data[k]=obj[k]; });
      LS_KEYS.forEach(k=> App.save(k));
      App.render(); App.toast('导入恢复成功', 'ok');
    }catch(e){ App.toast('文件格式错误', 'err'); }
  };
  r.readAsText(f); ev.target.value='';
};
App.resetDemo = function(){
  App.confirm('将用内置示例数据覆盖当前全部数据，确定？', function(){
    LS_KEYS.forEach(k=>{ App.data[k]=JSON.parse(JSON.stringify(MOCK[k])); App.save(k); });
    App.render(); App.toast('已重置为示例数据', 'ok');
  });
};
App.clearAll = function(){
  App.confirm('将清空全部数据（不可恢复），确定？', function(){
    LS_KEYS.forEach(k=>{ App.data[k]=[]; App.save(k); });
    App.render(); App.toast('已清空全部数据');
  });
};

/* ============ 通用 CRUD：列表/筛选/排序/分页/表单/校验 ============ */
const PAGE = 8;
/* 模块专属下拉筛选 */
const FSEL = {
  kb:{field:'domain',label:'领域',opts:['政治理论','省情热点','机关实务','公文写作','综合能力','基层治理','热点专题']},
  papers:{field:'group',label:'类别',opts:['真题','模考','原创']},
  wrong:{field:'status',label:'状态',opts:['待巩固','已掌握']},
  jin:{field:'cat',label:'分类',opts:['实干担当','民生情怀','发展创新','生态文明','基层治理','党建政绩','湖北支点','经典用典']},
  plans:{field:'status',label:'状态',opts:['进行中','已完成','未开始']}
};

/* 渲染某个 CRUD 模块主区 */
App.renderModule = function(key){
  const m = MODULES[key];
  let bar = '<div class="toolbar"><b style="font-size:16px">'+m.label+'</b>'+
    '<input type="search" placeholder="本模块搜索…" value="'+(App.state.filter.txt||'')+'" oninput="App.setFilterTxt(this.value)">'+
    (FSEL[key]?('<select onchange="App.setFilterSel(this.value)"><option value="">'+FSEL[key].label+'：全部</option>'+
      FSEL[key].opts.map(o=>'<option'+(App.state.filter.sel===o?' selected':'')+'>'+o+'</option>').join('')+'</select>'):'')+
    '<button class="btn gold" style="margin-left:auto" onclick="App.openForm(\''+key+'\')">＋ 新增</button></div>';
  document.getElementById('main').innerHTML = bar + '<div id="listWrap"></div>';
  App.renderList(key);
};

/* 列表：筛选 + 排序 + 分页 */
App.renderList = function(key){
  const m = MODULES[key];
  let rows = App.data[key].slice();
  const ft = (App.state.filter.txt||'').trim().toLowerCase();
  if(ft) rows = rows.filter(r=> Object.values(r).some(v=> String(v==null?'':v).toLowerCase().includes(ft)));
  if(App.state.filter.sel) rows = rows.filter(r=> r[FSEL[key].field]===App.state.filter.sel);
  const sk = App.state.sort.key, sd = App.state.sort.dir;
  if(sk) rows.sort((a,b)=>{ let x=a[sk],y=b[sk]; if(x==null)x=''; if(y==null)y=''; x=String(x); y=String(y);
    return sd==='asc'? (x>y?1:x<y?-1:0) : (x<y?1:x>y?-1:0); });
  const total = rows.length, pages = Math.max(1, Math.ceil(total/PAGE));
  if(App.state.page>pages) App.state.page=pages;
  const start = (App.state.page-1)*PAGE;
  const pageRows = rows.slice(start, start+PAGE);
  const head = '<tr>'+m.columns.map(c=>'<th onclick="App.sortBy(\''+key+'\',\''+c.k+'\')">'+c.t+
    (App.state.sort.key===c.k?(App.state.sort.dir==='asc'?' ▲':' ▼'):'')+'</th>').join('')+
    '<th>操作</th></tr>';
  const body = pageRows.length? pageRows.map(r=>{
    const id = r.id||('row'+JSON.stringify(r).length+start);
    let tds = m.columns.map(c=>{ let v=r[c.k]; let disp = c.r? c.r(v) : (v==null?'':v); return '<td>'+disp+'</td>'; }).join('');
    return '<tr class="'+(App.state.selId===id?'sel':'')+'" onclick="App.sel(\''+key+'\',\''+id+'\')">'+tds+
      '<td><span class="chip gray" style="cursor:pointer" onclick="event.stopPropagation();App.openForm(\''+key+'\',\''+id+'\')">编辑</span> '+
      '<span class="chip red" style="cursor:pointer" onclick="event.stopPropagation();App.remove(\''+key+'\',\''+id+'\')">删除</span></td></tr>';
  }).join('') : '<tr><td colspan="'+(m.columns.length+1)+'"><div class="empty">暂无数据，点击右上角「＋ 新增」添加</div></td></tr>';
  let pager = '<div class="pager">共 '+total+' 条 · 第 '+App.state.page+'/'+pages+' 页 ';
  pager += '<button '+(App.state.page<=1?'disabled':'')+' onclick="App.pageTo('+(App.state.page-1)+')">上一页</button>';
  pager += '<button '+(App.state.page>=pages?'disabled':'')+' onclick="App.pageTo('+(App.state.page+1)+')">下一页</button></div>';
  document.getElementById('listWrap').innerHTML = '<table class="tbl"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>'+pager;
};

App.sortBy = function(key, col){ if(App.state.sort.key===col) App.state.sort.dir = App.state.sort.dir==='asc'?'desc':'asc'; else {App.state.sort.key=col; App.state.sort.dir='asc';} App.renderList(key); };
App.pageTo = function(p){ App.state.page=p; App.renderList(App.state.current); };
App.setFilterTxt = function(v){ App.state.filter.txt=v; App.state.page=1; App.renderList(App.state.current); };
App.setFilterSel = function(v){ App.state.filter.sel=v; App.state.page=1; App.renderList(App.state.current); };

/* 选中行 -> 右侧详情面板 */
App.sel = function(key, id){
  App.state.selId = id;
  const m = MODULES[key];
  const item = App.data[key].find(r=> (r.id||'')===id) || {};
  document.getElementById('panel').innerHTML = '<div class="spread" style="margin-bottom:8px"><b style="font-size:15px">详情 / 属性</b>'+
    '<span class="chip gray">'+m.label+'</span></div>'+ (m.detail? m.detail(item) : JSON.stringify(item,null,2))+
    '<div class="row" style="margin-top:12px"><button class="btn sm" onclick="App.openForm(\''+key+'\',\''+id+'\')">编辑</button>'+
    '<button class="btn sm danger" onclick="App.remove(\''+key+'\',\''+id+'\')">删除</button></div>';
  App.renderList(key);
};

/* 打开新增/编辑表单 */
App.openForm = function(key, id){
  const m = MODULES[key];
  const item = id? (App.data[key].find(r=>(r.id||'')===id)||{}) : {};
  let f = m.fields.map(fl=>{
    let val = item[fl.n]!=null? item[fl.n] : '';
    let ctrl;
    if(fl.type==='textarea') ctrl = '<textarea name="'+fl.n+'" placeholder="'+(fl.ph||'')+'">'+val+'</textarea>';
    else if(fl.type==='select') ctrl = '<select name="'+fl.n+'"><option value="">— 请选择 —</option>'+fl.opts.map(o=>'<option'+(val===o?' selected':'')+'>'+o+'</option>').join('')+'</select>';
    else ctrl = '<input name="'+fl.n+'" type="'+(fl.type||'text')+'" value="'+val+'" placeholder="'+(fl.ph||'')+'">';
    return '<div class="field" data-f="'+fl.n+'"><label>'+fl.l+(fl.req?'<span class="req">*</span>':'')+'</label>'+ctrl+'<div class="err">此项为必填</div></div>';
  }).join('');
  App.openModal('<h2>'+(id?'编辑':'新增')+m.label+'</h2><form id="frm" onsubmit="return false">'+f+'</form>'+
    '<div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn ghost" onclick="App.closeModal()">取消</button>'+
    '<button class="btn gold" id="saveBtn">保存</button></div>');
  document.getElementById('saveBtn').onclick = function(){ App.saveForm(key, id); };
};

/* 表单校验：必填 + 数字/日期格式 */
App.validateForm = function(fields){
  let ok = true;
  fields.forEach(fl=>{
    const wrap = document.querySelector('#frm .field[data-f="'+fl.n+'"]');
    if(!wrap) return;
    const el = wrap.querySelector('input,select,textarea');
    const v = (el.value||'').trim();
    let bad = fl.req && !v;
    if(!bad && v && (fl.type==='number') && isNaN(Number(v))) bad = true;
    wrap.classList.toggle('bad', bad);
    if(bad){ ok=false; wrap.querySelector('.err').textContent = (fl.type==='number'&&v&&isNaN(Number(v)))?'请填有效数字':(fl.l+'为必填'); }
  });
  return ok;
};

/* 保存：校验 -> 组装 -> upsert -> 持久化 */
App.saveForm = function(key, id){
  const m = MODULES[key];
  if(!App.validateForm(m.fields)){ App.toast('请检查表单必填项', 'err'); return; }
  const fd = {};
  m.fields.forEach(fl=>{ const el=document.querySelector('#frm [name="'+fl.n+'"]'); let v=el.value.trim();
    if(fl.type==='number') v = v===''?null:Number(v); fd[fl.n]=v; });
  let item = id? (App.data[key].find(r=>(r.id||'')===id)||{}) : {id:uid(key[0])};
  Object.assign(item, fd);
  if(m.onSave) m.onSave(item, fd);
  if(!id) App.data[key].unshift(item);
  App.save(key);
  App.closeModal();
  App.renderList(key);
  if(id) App.sel(key, id);
  App.toast(id?'已更新':'已新增', 'ok');
};

/* 删除 */
App.remove = function(key, id){
  App.confirm('确定删除该项？删除后不可恢复。', function(){
    App.data[key] = App.data[key].filter(r=>(r.id||'')!==id);
    App.save(key);
    if(App.state.selId===id){ App.state.selId=null; document.getElementById('panel').innerHTML='<div class="mut">从左侧或列表选择一项查看详情</div>'; }
    App.renderList(key);
    App.toast('已删除');
  });
};

  const weak = d.wrong.filter(w=>w.status==='待巩固');
  const daily = d.plans.filter(p=>p.type==='每日');
  const todayHtml =
    '<div class="card" style="border-left:4px solid #dc2626"><b style="color:#dc2626">到期背诵卡（'+due.length+'）</b>'+
      (due.length? '<div style="margin-top:6px">'+due.slice(0,3).map(c=>'<div class="chip red" style="cursor:pointer" onclick="App.go(\'cards\')">'+c.front+'</div>').join('')+'</div>' : '<div class="mut">暂无到期，状态良好 ✓</div>')+'</div>'+
    '<div class="card" style="border-left:4px solid #e2a252"><b style="color:#b45309">待巩固错题（'+weak.length+'）</b>'+
      (weak.length? '<div style="margin-top:6px">'+weak.slice(0,3).map(w=>'<div class="chip gold" style="cursor:pointer" onclick="App.go(\'wrong\')">'+w.qTitle+'</div>').join('')+'</div>' : '<div class="mut">已全部掌握 ✓</div>')+'</div>'+
    '<div class="card" style="border-left:4px solid #2563eb"><b style="color:#2563eb">今日计划（'+daily.length+'）</b>'+
      (daily.length? '<div style="margin-top:6px">'+daily.map(p=>'<div class="chip" style="cursor:pointer" onclick="App.go(\'plans\')">'+p.title+' · '+p.status+'</div>').join('')+'</div>' : '<div class="mut">未设置</div>')+'</div>';
  document.getElementById('main').innerHTML =
    '<h1 style="font-size:20px;margin-bottom:4px">工作台首页</h1>'+
    '<p class="mut" style="margin-bottom:14px">湖北遴选复习系统 · 数据存于本机浏览器 · 内置示例数据可演示完整 CRUD</p>'+
    '<div class="row" style="gap:12px;margin-bottom:18px">'+cards+'</div>'+
    '<h3 style="margin-bottom:8px">今日要处理</h3>'+todayHtml+
    '<div class="card" style="margin-top:14px"><b>快速开始</b><div class="mut" style="margin-top:6px">左侧选择模块进入列表；点击任意行在右侧查看详情；右上角「＋ 新增」增数据；行内「编辑 / 删除」即时生效。顶栏可全局搜索、导出 / 导入备份。</div></div>';
  document.getElementById('panel').innerHTML = '<div class="mut">从列表或首页选择一项，此处显示详情与属性。</div>';
};

/* 全局搜索：跨模块匹配 */
App.search = function(q){
  q = (q||'').trim().toLowerCase();
  if(!q){ if(App.state.current!=='dashboard') App.go('dashboard'); return; }
  const res = [];
  ['kb','papers','wrong','cards','jin','topics','plans'].forEach(k=>{
    App.data[k].forEach(r=>{
      const hay = JSON.stringify(r).toLowerCase();
      if(hay.includes(q)) res.push({k, item:r});
    });
  });
  const groups = {};
  res.forEach(x=>{ (groups[x.k]=groups[x.k]||[]).push(x.item); });
  const titleMap = {kb:'考点库',papers:'模拟试卷',wrong:'错题本',cards:'背诵卡',jin:'金句库',topics:'省情专题',plans:'复习计划'};
  let html = '<h1 style="font-size:19px;margin-bottom:4px">全局搜索：“'+q+'”</h1><p class="mut" style="margin-bottom:12px">命中 '+res.length+' 条</p>';
  html += Object.keys(groups).map(k=>'<div class="card"><b>'+titleMap[k]+'（'+groups[k].length+'）</b>'+
    groups[k].slice(0,6).map(it=>{ const label = it.name||it.title||it.qTitle||it.front||it.text||'(无标题)';
      const id = it.id||''; return '<div class="chip" style="cursor:pointer;display:block;margin:6px 0" onclick="App.go(\''+k+'\');App.sel(\''+k+'\',\''+id+'\')">'+label+'</div>'; }).join('')).join('');
  document.getElementById('main').innerHTML = html || '<div class="empty">无匹配结果</div>';
};

/* 启动 */
App.start = function(){
  App.initData();
  App.load();
  App.render();
};
document.addEventListener('DOMContentLoaded', App.start);

</script>

</footer>
